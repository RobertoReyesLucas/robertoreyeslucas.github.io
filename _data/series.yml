title: AI-Driven Campaign Management
description: >-
  A five-part series on how AI is changing lead capture in digital campaigns, written
  during my MSc in Digital Marketing at Maynooth University. It includes primary research:
  a consumer survey and interviews with people who run campaigns.
parts:
  - part: 1
    title: "The Evolution of Lead Capture: From Static Landing Pages to Autonomous Funnels"
    planned: 2026-10-16
  - part: 2
    title: "Consumer Psychology & The Trust Gap in Conversational AI"
    planned: 2026-10-30
  - part: 3
    title: "Empirical Analysis: Consumer Behaviour in Autonomous Booking & Lead Capture"
    planned: 2026-11-13
  - part: 4
    title: "Practitioner Perspectives: Implementing AI Funnels in Real Campaigns"
    planned: 2026-11-27
  - part: 5
    title: "The Future of Full-Funnel Autonomous Marketing: Ethics, Privacy & Strategy"
    planned: 2026-12-11
